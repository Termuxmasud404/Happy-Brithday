<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>🎂 Birthday Surprise 🎂</h1>

<input type="text" id="name" placeholder="Enter Birthday Name">

<div class="heart" id="heart">❤️</div>

<button id="shootBtn">🏹 Shoot Arrow</button>

<div id="message" class="hidden">
<h2>🎉 Happy Birthday <span id="userName"></span> 🎉</h2>
<p>💖 Wishing you happiness, success and lots of love! 💖</p>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
